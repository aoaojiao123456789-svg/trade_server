#welcomeMessage: "欢迎使用{{appName}}" # 欢迎消息
#phoneSearchOff: true # 关闭手机号搜索用户功能
#onlineStatusOn: true # 开启在线状态功能
#groupUpgradeWhenMemberCount: 1000 # 群组人数达到多少人时，群组自动升级为超级群组
#eventPoolSize: 100 # 事件池大小

