##################### 头像 #####################
avatar:
  defaultBaseURL: "aaaaaaaaaaaaaaaaaaaaaa" # 默认头像cdn地址
  default: "assets/assets/avatar.png" # 默认头像
  defaultCount: 900 # 默认头像数量
  partition: 100 # 头像分区数量

##################### 假人 #####################
manequin:
  manequinOn: true # 是否开启假人功能
  manequinIntervalSecond: 5 # 假人发送消息间隔秒数

